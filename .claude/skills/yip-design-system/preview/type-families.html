<!doctype html>
<!-- @dsCard group="Type" name="Type families" subtitle="Bricolage · Hanken · Space Mono" viewport="700x290" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:28px 32px;display:flex;flex-direction:column;gap:20px}
  .fam{display:flex;align-items:baseline;gap:18px}
  .meta{width:150px;flex:none}
  .role{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sea-600)}
  .fname{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--fg-1);margin-top:2px}
  .use{font-size:11px;color:var(--fg-3)}
  .spec{flex:1}
  .glyphs{font-size:30px;color:var(--fg-1);line-height:1.1}
</style>
</head>
<body>
<div class="card yip">
  <div class="fam">
    <div class="meta"><div class="role">Display</div><div class="fname">Bricolage Grotesque</div><div class="use">headlines · prices · hooks</div></div>
    <div class="spec"><div class="glyphs" style="font-family:var(--font-display);font-weight:800;letter-spacing:-.02em">Last warm week — €59</div></div>
  </div>
  <div class="fam">
    <div class="meta"><div class="role">Body / UI</div><div class="fname" style="font-family:var(--font-body)">Hanken Grotesk</div><div class="use">paragraphs · interface</div></div>
    <div class="spec"><div class="glyphs" style="font-family:var(--font-body);font-size:22px;line-height:1.4">Direct from Vilnius, mid-October. The sun's still out and the crowds have gone home.</div></div>
  </div>
  <div class="fam">
    <div class="meta"><div class="role">Mono</div><div class="fname" style="font-family:var(--font-mono);font-size:15px">Space Mono</div><div class="use">ticket metadata · codes</div></div>
    <div class="spec"><div class="glyphs" style="font-family:var(--font-mono);font-size:18px;text-transform:uppercase;letter-spacing:.02em;color:var(--fg-2)">VNO → LCA · 14 OCT · #VNO-CY-204</div></div>
  </div>
</div>
</body>
</html>
