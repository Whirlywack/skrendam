<!doctype html>
<!-- @dsCard group="Colors" name="Sand (neutrals)" subtitle="Warm grey ramp — paper to ink" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:26px 30px}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--fg-1)}
  .desc{font-size:13px;color:var(--fg-2)}
  .row{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:62px;border-radius:12px;border:1px solid rgba(28,24,19,.07)}
  .k{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
  .h{font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card yip">
  <div class="top">
    <div class="name">Sand — warm neutrals</div>
    <div class="desc">Greys are warmed, never cold/blue. Paper, surfaces, borders, ink.</div>
  </div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--sand-0)"></div><div class="k">0</div><div class="h">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-50)"></div><div class="k">50 paper</div><div class="h">#FBF6EC</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-100)"></div><div class="k">100</div><div class="h">#F4ECDD</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-150)"></div><div class="k">150</div><div class="h">#ECE1CD</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-200)"></div><div class="k">200 line</div><div class="h">#E0D2BA</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-300)"></div><div class="k">300</div><div class="h">#C8B79C</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-400)"></div><div class="k">400</div><div class="h">#A8967A</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-500)"></div><div class="k">500 fg3</div><div class="h">#877860</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-600)"></div><div class="k">600 fg2</div><div class="h">#685B47</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-700)"></div><div class="k">700</div><div class="h">#4A4034</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-800)"></div><div class="k">800</div><div class="h">#2F2922</div></div>
    <div class="sw"><div class="chip" style="background:var(--sand-900)"></div><div class="k">900 ink</div><div class="h">#1C1813</div></div>
  </div>
</div>
</body>
</html>
