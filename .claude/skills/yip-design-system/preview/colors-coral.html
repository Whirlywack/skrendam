<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:26px 30px}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--fg-1)}
  .desc{font-size:13px;color:var(--fg-2)}
  .row{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:12px;border:1px solid rgba(28,24,19,.06);position:relative}
  .k{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
  .star{position:absolute;top:6px;right:8px;font-size:13px;color:#fff}
  .brand{box-shadow:0 0 0 2px var(--bg-surface),0 0 0 4px var(--coral-500)}
  .ramp{display:flex;gap:8px;margin-top:6px}
</style>
</head>
<body>
<div class="card yip">
  <div class="top">
    <div class="name">Coral — deal heat</div>
    <div class="desc">Urgency only: "going fast", price drops, danger. Ration it. <code style="font-size:11px">--danger</code> = 500</div>
  </div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--coral-50)"></div><div class="k">50</div><div class="h">#FDECE8</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-100)"></div><div class="k">100</div><div class="h">#FAD4CB</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-200)"></div><div class="k">200</div><div class="h">#F4A797</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-300)"></div><div class="k">300</div><div class="h">#ED7660</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-400)"></div><div class="k">400</div><div class="h">#E55438</div></div>
    <div class="sw"><div class="chip brand" style="background:var(--coral-500)"><span class="star">★</span></div><div class="k">500</div><div class="h">#D63E22</div></div>
    <div class="sw"><div class="chip" style="background:var(--coral-600)"></div><div class="k">600</div><div class="h">#B53017</div></div>
  </div>
</div>
</body>
</html>
