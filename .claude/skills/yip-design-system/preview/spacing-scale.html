<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base grid" viewport="700x205" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:26px 30px}
  .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--fg-1);margin-bottom:4px}
  .sub{font-size:13px;color:var(--fg-2);margin-bottom:18px}
  .row{display:flex;align-items:flex-end;gap:14px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--amber-400);border-radius:4px;width:26px}
  .k{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
  .px{font-family:var(--font-mono);font-size:9px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card yip">
  <div class="name">Spacing — 4px grid</div>
  <div class="sub">Airy by default; the public site breathes, the curator tool tightens up.</div>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><div class="k">1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="k">2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="k">3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="k">4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="height:20px"></div><div class="k">5</div><div class="px">20</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="k">6</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="k">8</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="k">10</div><div class="px">40</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="k">12</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="k">16</div><div class="px">64</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="k">20</div><div class="px">80</div></div>
  </div>
</div>
</body>
</html>
