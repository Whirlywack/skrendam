<!doctype html>
<!-- @dsCard group="Components" name="Inputs & signup" subtitle="Email capture + form fields" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:26px 32px;display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:9px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:13px;font-weight:600;color:var(--fg-2)}
  input{font-family:var(--font-body);font-size:15px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);background:var(--bg-surface);color:var(--fg-1);outline:none}
  input::placeholder{color:var(--fg-3)}
  .focus{border-color:var(--sea-400);box-shadow:var(--focus-ring)}
  .signup{display:flex;gap:8px}
  .signup input{flex:1}
  .sub{background:var(--amber-500);color:var(--fg-on-amber);border:none;border-radius:var(--radius-sm);font-weight:600;font-size:15px;padding:0 18px;cursor:pointer;white-space:nowrap}
  .hint{font-size:12px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card yip">
  <div>
    <div class="tag">Newsletter signup · the core action</div>
    <div class="signup">
      <input type="email" placeholder="you@email.com">
      <button class="sub">Get deals</button>
    </div>
    <div class="hint" style="margin-top:8px">A few great deals a week. No spam. Unsubscribe anytime.</div>
  </div>
  <div class="field">
    <label>Departure airport</label>
    <input value="Vilnius (VNO)">
  </div>
  <div class="field">
    <label>Email — focused</label>
    <input class="focus" value="rasa@" >
  </div>
  <div class="field">
    <label>Default field</label>
    <input placeholder="Placeholder text">
  </div>
</div>
</body>
</html>
