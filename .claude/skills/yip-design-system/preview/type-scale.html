<!doctype html>
<!-- @dsCard group="Type" name="Display scale" subtitle="Headline sizes, tight tracking" viewport="700x255" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  .card{width:700px;box-sizing:border-box;background:var(--bg-surface);font-family:var(--font-body);padding:26px 32px;display:flex;flex-direction:column;gap:12px}
  .line{display:flex;align-items:baseline;gap:16px}
  .tk{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);width:64px;flex:none}
  .sample{font-family:var(--font-display);font-weight:700;color:var(--fg-1);letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="card yip">
  <div class="line"><span class="tk">5xl/66</span><span class="sample" style="font-size:52px;font-weight:800">September sun</span></div>
  <div class="line"><span class="tk">3xl/40</span><span class="sample" style="font-size:38px">Christmas markets</span></div>
  <div class="line"><span class="tk">xl/26</span><span class="sample" style="font-size:26px;font-weight:600">Why this deal is good</span></div>
  <div class="line"><span class="tk">lg/21</span><span class="sample" style="font-size:21px;font-weight:600;font-family:var(--font-body)">Direct from Vilnius</span></div>
  <div class="line"><span class="tk">base/16</span><span class="sample" style="font-size:16px;font-weight:400;font-family:var(--font-body);letter-spacing:0">Crowds gone, sun still out — book before Sunday.</span></div>
</div>
</body>
</html>
