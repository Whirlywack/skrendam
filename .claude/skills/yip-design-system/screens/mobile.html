<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yip Deal Desk — mobile</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../assets/logo.css">
<style>
  html,body{margin:0;background:
    radial-gradient(1200px 600px at 50% -10%, #FCE9C6, transparent 60%),
    var(--bg-page);
    min-height:100vh;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 20px}
  .cap{text-align:center}
  .cap .eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-600)}
  .cap h1{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:8px 0 4px;color:var(--fg-1)}
  .cap p{font-size:14px;color:var(--fg-2);margin:0}
  .hint{font-size:12px;color:var(--fg-3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div class="stage" data-screen-label="Deal Desk · mobile app">
  <div class="cap">
    <div class="eyebrow">Yip Deal Desk · mobile</div>
    <h1>Approve deals from your pocket</h1>
    <p>Tap a deal to review it, then approve &amp; publish — the founder's whole flow, on a phone.</p>
  </div>
  <div id="root"></div>
  <div class="hint">↑ tap through it — it's interactive</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="mobile-app.jsx"></script>
</body>
</html>
