name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag/branch/SHA) to check out. Defaults to the caller ref.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python || 'true' }}
      web: ${{ steps.filter.outputs.web || 'true' }}
      site: ${{ steps.filter.outputs.site || 'true' }}
      workflows: ${{ steps.filter.outputs.workflows || 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - 'fli/**'
              - 'skrendam/**'
              # the pytest drift guard (test_shared_data) must run when the app
              # copies of the shared IATA maps change in a site/web-only PR
              - 'site/src/lib/airports.json'
              - 'site/src/lib/airlines.json'
              - 'web/src/lib/airports.json'
              - 'web/src/lib/airlines.json'
              - 'tests/**'
              - 'alembic/**'
              - 'scripts/**'
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actionlint.yaml'

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          # Show inline annotations on the PR diff for any findings
          matcher: true

  lint:
    name: Lint Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format . --check

      - name: Check style
        run: uv run ruff check .

  test:
    name: test
    needs: [ changes, lint ]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # skrendam extra: tests/skrendam imports sqlalchemy/alembic — without it
        # collection fails with ModuleNotFoundError (first red main run, 2026-08-21)
        run: uv sync --extra dev --extra mcp --extra skrendam

      - name: Run tests
        run: |
          uv run pytest tests/ --all -v \
            --ignore=tests/search/ \
            -k "not test_search_dates_round_trip" \
            --junitxml=junit.xml
        env:
          FORCE_COLOR: 1

      - name: Upload Test Results
        if: always() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: junit.xml

  web:
    name: web / Deal Desk
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-only-secret-not-used-in-prod"

  site:
    name: site / Public site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # compile-only: the collection pages prerender at build time and query the
        # DB; CI has no database, so a full build always fails with NeonDbError.
        # Compile mode validates bundling/routes without static generation —
        # production builds (which have a real DATABASE_URL) are unaffected.
        run: npx next build --experimental-build-mode compile
        env:
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"

  publish-test-results:
    name: Publish Test Results
    needs: [ test ]
    runs-on: ubuntu-latest
    if: always() && needs.test.result != 'skipped'
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/junit.xml"
          check_name: "Test Results"
          comment_mode: always
          compare_to_earlier_commit: true
